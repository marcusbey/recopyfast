# fly.toml – RecopyFast Socket.io server on Fly.io
# ---------------------------------------------------------------------------
# This file lives in server/ ON PURPOSE: `fly deploy` uses the directory of
# fly.toml as the Docker build context, and server/Dockerfile is written for a
# server/-rooted context (it COPYs server/package.json and runs `node index.js`).
# Deploying from repo root would put index.js at /app/server/index.js and break
# the CMD.
#
# Deploy:
#   cd server
#   fly secrets set \
#     NEXT_PUBLIC_SUPABASE_URL=... \
#     SUPABASE_SERVICE_ROLE_KEY=... \
#     REDIS_URL=...
#   fly deploy
#
# All three are required, and REDIS_URL is required FIRST — set it before the
# deploy that brings the code reading it, not after. assertProductionEnvironment()
# in index.js refuses to boot in production without it, so a deploy that arrives
# ahead of the secret is a crash loop rather than a degradation. The reason it
# refuses is ADR 002 rule 4: this process holds SUPABASE_SERVICE_ROLE_KEY and is
# opened by a token published in the customer's own page markup, so its limiter
# denies on store failure — and refusing to start is louder than refusing every
# connection all day while /health keeps answering 200.
#
# NEXT_PUBLIC_APP_URL is read too (index.js) but defaults to http://localhost:3000
# and nothing here depends on it; set it if you want it in the logs.
#
# ALLOWED_ORIGINS is deliberately NOT in that list, and must not be added. The
# variable is not consulted anywhere in this service — `grep -rn ALLOWED_ORIGINS
# server/*.js` returns nothing since s07a rewrote the connection handler, so
# there is no line to read and nothing to reinstate. Authorisation is the
# per-site HMAC token check at index.js:256 (`verifySiteToken`, auth.js:50)
# followed by the registered-domain pin at :263 (`isOriginAllowed`, auth.js:101),
# both inside the connection handler. That pair is strictly stronger than an
# origin allowlist and needs no redeploy per customer. Setting ALLOWED_ORIGINS
# would create false confidence about where the security boundary is.
#
# Note: site tokens are HMAC-signed with each site's API key (read from the DB
# via the service-role key) — there is no separate token-secret env var.
#
# ---------------------------------------------------------------------------
# RECONCILED 2026-08-17 against the live `recopyfast-ws` app, which had been
# created with Fly's generated defaults. Four things disagreed; all four are
# fixed here, and `fly deploy` is what makes them real.
#
#   1. PORT — Fly routed to internal_port 8080. server/index.js:1177 binds
#      `process.env.WS_PORT || 4001` and ignores PORT entirely, so NOTHING
#      listened on 8080. This was a total outage, not a degradation.
#   2. AUTOSTOP — Fly had auto_stop_machines = true with min_machines_running
#      = 0. Its idle detection is request-based and a quiet WebSocket looks
#      idle, so open editing sessions would be dropped. Both corrected below.
#   3. HEALTH — the generated config had no health check at all, though
#      /health exists (server/index.js:228) and s07b AC 3 depends on it.
#   4. MEMORY — `memory = "1gb"` and `memory_mb = 512` were both set and
#      disagreed. One value only, below.
#
# ⛔ ONE MACHINE, AND THAT IS LOAD-BEARING — DO NOT SCALE WITHOUT READING THIS
# ---------------------------------------------------------------------------
# Scaled to one machine on 2026-08-17, deliberately. Socket.io rooms live in the
# MEMORY OF ONE PROCESS. With one machine that is invisible and everything works.
#
# The moment a second machine exists, two editors on the same page can land on
# different processes, join the same room name in two separate memories, and stop
# seeing each other — while every health check stays green and nothing is thrown.
# It presents as "realtime randomly stopped working for some people", which is the
# hardest possible shape of bug report to act on.
#
# There is a second, louder failure too: socket.io's handshake is stateful, so a
# polling exchange split across machines dies with `Session ID unknown`.
#
# So scaling this service is NOT a scaling operation. It is a code change that must
# ship @socket.io/redis-adapter in the same deploy (and the adapter fixes only the
# FIRST failure — it shares rooms, not sessions; the transport pinning below covers
# the second).
#
# Do not read `redis` in server/package.json as "the adapter is already here". That
# is node-redis, the store behind s07a's fail-closed connection limiter
# (rate-limit.js:82). @socket.io/redis-adapter is a DIFFERENT package and is absent
# — `grep -n redis-adapter server/package.json` returns nothing — and it is the
# adapter, not the client, that shares rooms across machines.
# See ADR 023, ADR 026 and docs/plans/s07b-realtime-deploy.md.
#
# `fly scale count 2` without that work is a silent outage for co-editing.
# ---------------------------------------------------------------------------

app            = "recopyfast-ws"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"        # relative to this file (server/)

[env]
  # Non-secret runtime defaults – override sensitive values with `fly secrets set`.
  WS_PORT  = "4001"
  NODE_ENV = "production"

[http_service]
  internal_port       = 4001       # MUST match WS_PORT above and index.js:1177
  force_https         = true
  processes           = ["app"]

  # A long-lived WebSocket service must never be stopped for looking idle, and
  # must never scale to zero: a cold start drops every open editing session.
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 1         # see the ONE MACHINE note in the header

  [http_service.concurrency]
    # Connections, not requests: a WebSocket is one long-lived connection, so
    # request-based limits measure the wrong thing entirely.
    type       = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"
    path         = "/health"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"                 # one value; the live config had two that disagreed
