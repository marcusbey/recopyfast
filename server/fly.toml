# fly.toml – RecopyFast Socket.io server on Fly.io
# ---------------------------------------------------------------------------
# This file lives in server/ ON PURPOSE: `fly deploy` uses the directory of
# fly.toml as the Docker build context, and server/Dockerfile is written for a
# server/-rooted context (it COPYs server/package.json and runs `node index.js`).
# Deploying from repo root would put index.js at /app/server/index.js and break
# the CMD.
#
# Deploy:
#   cd server
#   fly secrets set \
#     NEXT_PUBLIC_SUPABASE_URL=... \
#     SUPABASE_SERVICE_ROLE_KEY=...
#   fly deploy
#
# ALLOWED_ORIGINS is deliberately NOT in that list. server/index.js:174 and :196
# record that it is no longer consulted: authorisation is the per-site HMAC token
# check in the connection handler, which is strictly stronger than an origin
# allowlist and does not need a redeploy per customer. Setting it would create
# false confidence about where the security boundary is.
#
# Note: site tokens are HMAC-signed with each site's API key (read from the DB
# via the service-role key) — there is no separate token-secret env var.
#
# ---------------------------------------------------------------------------
# RECONCILED 2026-08-17 against the live `recopyfast-ws` app, which had been
# created with Fly's generated defaults. Four things disagreed; all four are
# fixed here, and `fly deploy` is what makes them real.
#
#   1. PORT — Fly routed to internal_port 8080. server/index.js:1177 binds
#      `process.env.WS_PORT || 4001` and ignores PORT entirely, so NOTHING
#      listened on 8080. This was a total outage, not a degradation.
#   2. AUTOSTOP — Fly had auto_stop_machines = true with min_machines_running
#      = 0. Its idle detection is request-based and a quiet WebSocket looks
#      idle, so open editing sessions would be dropped. Both corrected below.
#   3. HEALTH — the generated config had no health check at all, though
#      /health exists (server/index.js:228) and s07b AC 3 depends on it.
#   4. MEMORY — `memory = "1gb"` and `memory_mb = 512` were both set and
#      disagreed. One value only, below.
#
# Two machines run in iad. Per ADR 023 that makes @socket.io/redis-adapter
# MANDATORY, not optional: Socket.io rooms live in one process's memory, so two
# editors can land on different machines and never see each other. The adapter
# is s07b's to ship, and it is not in server/package.json yet.
# ---------------------------------------------------------------------------

app            = "recopyfast-ws"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"        # relative to this file (server/)

[env]
  # Non-secret runtime defaults – override sensitive values with `fly secrets set`.
  WS_PORT  = "4001"
  NODE_ENV = "production"

[http_service]
  internal_port       = 4001       # MUST match WS_PORT above and index.js:1177
  force_https         = true
  processes           = ["app"]

  # A long-lived WebSocket service must never be stopped for looking idle, and
  # must never scale to zero: a cold start drops every open editing session.
  auto_stop_machines  = false
  auto_start_machines = true
  min_machines_running = 2         # matches the two machines actually running

  [http_service.concurrency]
    # Connections, not requests: a WebSocket is one long-lived connection, so
    # request-based limits measure the wrong thing entirely.
    type       = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    interval     = "15s"
    timeout      = "5s"
    grace_period = "10s"
    method       = "GET"
    path         = "/health"

[[vm]]
  size   = "shared-cpu-1x"
  memory = "512mb"                 # one value; the live config had two that disagreed
