# fly.toml – RecopyFast Socket.io server on Fly.io
# ---------------------------------------------------------------------------
# Adjust `app` and `primary_region` before running `fly deploy`.
# Secrets (env vars) are injected via `fly secrets set KEY=value` — do NOT
# hard-code them here.
#
# Deploy:
#   fly launch --no-deploy   # first time: creates the app on Fly
#   fly secrets set NEXT_PUBLIC_SUPABASE_URL=... SUPABASE_SERVICE_ROLE_KEY=...
#   fly deploy --dockerfile server/Dockerfile --build-context .
# ---------------------------------------------------------------------------

app       = "recopyfast-ws"       # change to your chosen Fly app name
primary_region = "iad"            # change to the region closest to your users

[build]
  # Dockerfile lives inside server/; the build context is the repo root so
  # we can pass secrets / env files if needed at build time.
  dockerfile = "server/Dockerfile"

[env]
  # Non-secret runtime defaults – override with `fly secrets set` for
  # anything sensitive.
  WS_PORT            = "4001"
  NODE_ENV           = "production"

[[services]]
  internal_port = 4001
  protocol      = "tcp"

  # HTTP service – Fly terminates TLS and forwards plain HTTP/WS to the app.
  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [[services.ports]]
    handlers = ["http"]
    port     = 80

  # Health check – Socket.io server exposes GET /health
  [[services.http_checks]]
    interval      = 15000   # ms between checks
    timeout       = 5000
    grace_period  = "10s"
    method        = "GET"
    path          = "/health"
    protocol      = "http"

[checks]
  # TCP check as a fallback (runs even before the HTTP server is up)
  [checks.tcp]
    type     = "tcp"
    port     = 4001
    interval = "30s"
    timeout  = "5s"
