# Supabase CLI configuration for local development.
# Docs: https://supabase.com/docs/guides/local-development/cli/config
#
# `project_id` names the local Docker stack. To work against the hosted project,
# run `supabase link --project-ref <ref>` — that writes .temp/project-ref and does
# not require editing this file.

project_id = "recopyfast"

[api]
enabled = true
port = 54321
# Schemas exposed over the REST/GraphQL API.
#
# NOTE: src/app/api/teams/[teamId]/activity/route.ts:44 embeds
# `auth.users!team_activity_log_user_id_fkey(...)`. PostgREST can only resolve
# that if the `auth` schema is exposed, which is NOT the default and is not
# recommended (it publishes the whole auth schema). Prefer changing the query to
# read from a public view over auth.users. See supabase/README.md.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
# Match the hosted project's Postgres major version.
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1:54321"

# Local email testing: every outbound mail is captured by Inbucket rather than sent.
[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
# Local only: skip the confirmation round-trip when developing.
enable_confirmations = false

[analytics]
enabled = false

[realtime]
enabled = true
