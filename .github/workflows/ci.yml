name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

# s75 (s69 L19): without this key the token gets the repository default, which
# can be read-write. No job here pushes, comments or publishes — the npm cache
# and the Playwright summary artifact use the runtime token, not GITHUB_TOKEN.
# Every action below is pinned to a full commit SHA, its release in a comment;
# a tag can be moved by whoever controls the action's repository.
permissions:
  contents: read

jobs:
  # ─── Main CI job: lint → test → build ─────────────────────────────────────
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      # scripts/run-db-invariants.mjs replays every real migration against this
      # disposable database and runs the plain-SQL database suites on it. It is
      # separate from the E2E Supabase stack and has no hosted credentials or
      # network-reachable endpoint. s75: production is PostgreSQL 17.4; this was
      # postgres:14 until then, so migrations were judged by another parser.
      # The runner refuses any other major (scripts/db/replay-checks.mjs).
      postgres-s38:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: recopyfast_s38_ci
        ports:
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d recopyfast_s38_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      # ── Supabase (dummy build-time values) ────────────────────────────────
      # These are intentionally placeholder values so `next build` can complete
      # without a real Supabase project. They do NOT grant any database access.
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6ImFub24iLCJpYXQiOjE2MDAwMDAwMDAsImV4cCI6MjAwMDAwMDAwMH0.placeholder-signature"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBsYWNlaG9sZGVyIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTYwMDAwMDAwMCwiZXhwIjoyMDAwMDAwMDAwfQ.placeholder-signature"

      # ── Stripe (dummy values – no real keys, no charges possible) ─────────
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_placeholder000000000000000000000000000000000000000000000000"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE: "pk_live_placeholder00000000000000000000000000000000000000000000000"
      STRIPE_SECRET_KEY: "sk_test_placeholder000000000000000000000000000000000000000000000000"
      STRIPE_WEBHOOK_SECRET: "whsec_placeholder00000000000000000000000000000000000000000000000000"

      # Price IDs are read by src/lib/stripe/plans.ts, and
      # src/__tests__/lib/stripe/config.test.ts asserts every plan resolves one.
      # Without these the plans resolve to `undefined` and the suite fails in CI
      # while passing locally (where .env supplies real values). Placeholders —
      # no Stripe API call is made in the test suite.
      STRIPE_STARTER_PRICE_ID: "price_test_starter_monthly_placeholder"
      STRIPE_STARTER_YEARLY_PRICE_ID: "price_test_starter_yearly_placeholder"
      STRIPE_PRO_PRICE_ID: "price_test_pro_monthly_placeholder"
      STRIPE_PRO_YEARLY_PRICE_ID: "price_test_pro_yearly_placeholder"
      STRIPE_AGENCY_PRICE_ID: "price_test_agency_monthly_placeholder"
      STRIPE_AGENCY_YEARLY_PRICE_ID: "price_test_agency_yearly_placeholder"
      STRIPE_ENTERPRISE_PRICE_ID: "price_test_enterprise_monthly_placeholder"
      STRIPE_ENTERPRISE_YEARLY_PRICE_ID: "price_test_enterprise_yearly_placeholder"
      STRIPE_TICKETS_PRICE_ID: "price_test_tickets_placeholder"
      STRIPE_LIFETIME_AGENCY_PRICE_ID: "price_test_lifetime_agency_placeholder"

      # ── App URL ───────────────────────────────────────────────────────────
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      # Baked into the embed snippet by src/lib/sites/embed-script.ts and
      # asserted verbatim by src/__tests__/api/sites/register/route.test.ts.
      # Unset, the snippet falls back to the app origin and that test fails in
      # CI while passing locally (where .env supplies this).
      NEXT_PUBLIC_WS_URL: "http://localhost:4001"

      # ── Sentry (omitted intentionally so withSentryConfig is bypassed) ────
      # next.config.ts only wraps with Sentry when NEXT_PUBLIC_SENTRY_DSN is set;
      # leaving it unset here keeps the build free of Sentry source-map uploads.
      # NEXT_PUBLIC_SENTRY_DSN: ""

      # ── CI flag (suppresses verbose Sentry logs in next.config.ts) ────────
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # s75: Node 24 LTS in every job, the realtime image (server/Dockerfile)
      # and Vercel (package.json `engines`). Node 20 was past end of life and
      # Vercel had discontinued 20.x, so CI was testing a runtime nothing ran.
      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Every step in this job is a blocking gate:
      # audit → lint → format → type-check → embed check → build → tests
      # (with the coverage ratchet) → database replay → script tests.

      # ── Step 0: Dependency vulnerabilities (BLOCKING) ─────────────────────
      # Production dependency tree only — dev-only advisories do not ship to
      # users and would otherwise block every PR on unrelated tooling churn.
      # The tree is currently clean; `overrides` in package.json pin `sharp`
      # and `postcss` above the versions Next transitively depends on.
      - name: Audit production dependencies (blocking)
        run: npm run audit:prod

      # ── Step 1: Lint (BLOCKING) ───────────────────────────────────────────
      - name: Lint (ESLint)
        run: npm run lint

      # ── Step 1b: Formatting (BLOCKING) ────────────────────────────────────
      # s75: in AGENTS.md's Definition of Done, but until s75 only the local
      # pre-commit hook ran it. Same glob as `npm run format`.
      - name: Check formatting (Prettier, blocking)
        run: npm run format:check

      # ── Step 2: Production type-check (BLOCKING) ──────────────────────────
      # Type-checks shipped app code only (tsconfig.build.json excludes tests).
      # next.config.ts sets ignoreBuildErrors:false, so the build also fails on
      # type errors — this explicit step surfaces them faster and clearer.
      - name: Type-check production code (tsc, blocking)
        run: npm run type-check:build

      # ── Step 3: Embed artifact freshness + byte ceiling (BLOCKING) ────────
      # Must run BEFORE the build. `npm run build` triggers `prebuild` →
      # `build:embed`, which rebuilds the artifact and then gates it — so by the
      # time the build has run, a stale committed `public/embed/recopyfast.js`
      # has been overwritten and CI can no longer see that it was stale. The
      # artifact is the file customers actually download, and it is served
      # straight from the repo, so a stale commit ships stale code to every
      # install. `--check` runs first, rebuilds nothing, and needs only Node.
      - name: Check embed artifact (freshness + gz ceiling, blocking)
        run: node scripts/build-embed.mjs --check

      # ── Step 4: Production build (BLOCKING) ───────────────────────────────
      - name: Build (Next.js)
        run: npm run build

      # ── Step 5: Unit / integration tests + coverage ratchet (Jest, BLOCKING) ─
      # A real gate — if it goes red, the deploy stops. Worker count + idle
      # memory limit stay capped to avoid the OOM/SIGABRT cascade this suite
      # used to hit on CI runners.
      #
      # s75: --coverage makes jest.config.js's coverageThreshold (the ratchet)
      # fail this step when coverage drops. Until s75 only the local prepush
      # script read the thresholds, so the ratchet held nowhere CI could see.
      # One run, not a second full pass: a threshold miss prints
      # `Jest: Coverage for lines (69.23%) does not meet "global" threshold (70%)`
      # (measured by raising one threshold), naming the metric while every test
      # still passes. text-summary keeps the coverage log to four lines.
      - name: Test with coverage ratchet (Jest – CI mode, blocking)
        run: npm test -- --ci --coverage --coverageReporters=text-summary --maxWorkers=2 --workerIdleMemoryLimit=512MB

      # s75: the replay's own checks — the PostgreSQL major it accepts, and the
      # report check that refuses a named suite that did not run — need no
      # database, so they are tested before the replay relies on them.
      - name: Test database replay checks (Node, blocking)
        run: node --test scripts/__tests__/replay-checks.test.mjs

      # A normal Jest run deliberately gates real-Postgres suites when no
      # matching database is present. This dedicated step sets a required-db
      # contract through the runner, so connectivity or migration failures are
      # red rather than a passing "not verified" placeholder.
      - name: Replay every migration on PostgreSQL 17 and run the database suites (blocking)
        env:
          RCF_TEST_DB_URL: "postgresql://postgres:postgres@127.0.0.1:55438/recopyfast_s38_ci"
        run: node scripts/run-db-invariants.mjs

      - name: Test Stripe catalogue tooling (Node, blocking)
        run: node --test scripts/__tests__/sync-stripe-catalogue.test.mjs

      # s65a: the operator's speed and freshness evidence comes from this
      # script, so its URL building, thresholds and polling are tested. Local
      # HTTP servers only — no network, no credential.
      - name: Test published-snapshot measurement tooling (Node, blocking)
        run: node --test scripts/__tests__/measure-published-snapshot.test.mjs

  # ─── Playwright end-to-end tests ───────────────────────────────────────────
  # This job owns a disposable stack. No hosted Supabase/Redis/Fly credential is
  # accepted: the mutating specs also enforce the exact loopback ports before
  # constructing a service-role client, so changing only this workflow cannot
  # point them at production. The strict reporter makes skipped/flaky/missing
  # tests a failure and writes the only uploaded artifact: a credential-free
  # summary with the exact expected 86-test count.
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:54321"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:3000"
      PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"
      NEXT_PUBLIC_WS_URL: "http://127.0.0.1:4001"
      REDIS_URL: "redis://127.0.0.1:6379"
      WS_PORT: "4001"
      RUN_RECOPYFAST_CORE_E2E: "1"
      RUN_RECOPYFAST_PARITY: "1"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_local_e2e_placeholder"
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY_LIVE: "pk_live_local_e2e_placeholder"
      STRIPE_SECRET_KEY: "sk_test_local_e2e_placeholder"
      STRIPE_WEBHOOK_SECRET: "whsec_local_e2e_placeholder"
      STRIPE_STARTER_PRICE_ID: "price_local_starter_monthly"
      STRIPE_STARTER_YEARLY_PRICE_ID: "price_local_starter_yearly"
      STRIPE_PRO_PRICE_ID: "price_local_pro_monthly"
      STRIPE_PRO_YEARLY_PRICE_ID: "price_local_pro_yearly"
      STRIPE_AGENCY_PRICE_ID: "price_local_agency_monthly"
      STRIPE_AGENCY_YEARLY_PRICE_ID: "price_local_agency_yearly"
      STRIPE_ENTERPRISE_PRICE_ID: "price_local_enterprise_monthly"
      STRIPE_ENTERPRISE_YEARLY_PRICE_ID: "price_local_enterprise_yearly"
      STRIPE_TICKETS_PRICE_ID: "price_local_tickets"
      STRIPE_LIFETIME_AGENCY_PRICE_ID: "price_local_lifetime_agency"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Prepare redacted report placeholder
        run: |
          set -euo pipefail
          mkdir -p test-results
          printf '%s\n' '{"contract":"not-run","expected":86,"total":0,"passed":0,"failed":0,"skipped":0,"flaky":0,"tests":[]}' > test-results/playwright-summary.json
          chmod 600 test-results/playwright-summary.json

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: "2.117.0"

      - name: Install root and WebSocket dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start Supabase and export local credentials
        run: |
          set -euo pipefail
          start_log="$RUNNER_TEMP/supabase-start.log"
          status_file="$RUNNER_TEMP/supabase-status.env"
          supabase start > "$start_log" 2>&1
          supabase status -o env > "$status_file" 2>/dev/null

          anon_key="$(sed -n 's/^ANON_KEY="\([^"]*\)"$/\1/p' "$status_file")"
          service_role_key="$(sed -n 's/^SERVICE_ROLE_KEY="\([^"]*\)"$/\1/p' "$status_file")"
          if [ -z "$anon_key" ] || [ -z "$service_role_key" ]; then
            echo "Local Supabase did not return both required credentials." >&2
            exit 1
          fi

          printf 'NEXT_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$anon_key" >> "$GITHUB_ENV"
          printf 'SUPABASE_SERVICE_ROLE_KEY=%s\n' "$service_role_key" >> "$GITHUB_ENV"
          rm -f "$status_file"

      - name: Verify secret-column privileges and content revisions through PostgreSQL and PostgREST
        env:
          RCF_TEST_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          RCF_REQUIRE_TEST_DB: "1"
          RCF_TEST_POSTGREST_URL: "http://127.0.0.1:54321"
        run: |
          RCF_TEST_POSTGREST_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            npx jest --runInBand \
              src/__tests__/db/column-privileges.test.ts \
              src/__tests__/db/public-content-revision.test.ts

      # s56 (ADR 042): no web principal writes a content table. Proved through
      # the real PostgREST with real GoTrue JWTs, lapsed and paying, and through
      # the real bulk handlers with a real session. DB suites run in CI only by
      # name; RCF_REQUIRE_TEST_DB makes a missing database OR a missing
      # PostgREST target a failure, never a "[gated]" pass.
      #
      # s65a (ADR 046): the snapshot route's freshness proof rides in the same
      # step, for the same reason. It changes and deletes a published row with
      # plain SQL and reads it back through the real route handler and the
      # local PostgREST. Before the s65a review it was named by no step, so
      # every CI run recorded its "[gated]" placeholder instead.
      #
      # s68a (ADR 047): edit_sessions takes no web-principal write (a real
      # GoTrue JWT is refused by PostgREST), the replay-only self-escalation
      # policies are gone, and the definer-function and RLS invariants run
      # against the Supabase CLI replay — named, not "[gated]".
      #
      # s68b (M3): the editor-code attempt charge is a compare-and-set through
      # PostgREST; 20 concurrent wrong guesses must land exactly five charges
      # and burn the code. Only the real PostgREST can say whether the loser of
      # a conditional UPDATE sees zero rows, so it rides in this step too.
      #
      # s70a: the embed-UI cleanup migration is executed on its exact seed in a
      # rolled-back transaction — seven rows deleted, every lookalike, edited
      # and review-tier row kept. Named here so it never records "[gated]".
      #
      # s70b (ADR 054): content_changes is a security-invoker view, which only
      # this stack can prove — PostgreSQL 15 has the option the bare PG14
      # replay lacks, and only real GoTrue JWTs through PostgREST show that an
      # edit member reads no "who" and that no member reads another tenant.
      - name: Verify content tables take no direct writes through PostgREST, the snapshot reads fresh rows, and editor-code attempts are charged atomically
        env:
          RCF_TEST_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          RCF_REQUIRE_TEST_DB: "1"
          RCF_TEST_POSTGREST_URL: "http://127.0.0.1:54321"
        run: |
          RCF_TEST_POSTGREST_ANON_KEY="$NEXT_PUBLIC_SUPABASE_ANON_KEY" \
          RCF_TEST_POSTGREST_SERVICE_ROLE_KEY="$SUPABASE_SERVICE_ROLE_KEY" \
            npx jest --runInBand \
              src/__tests__/db/content-write-privileges.test.ts \
              src/__tests__/db/published-snapshot-freshness.test.ts \
              src/__tests__/db/function-grants.test.ts \
              src/__tests__/db/rls-policies.test.ts \
              src/__tests__/db/edit-sessions-privileges.test.ts \
              src/__tests__/db/replay-privilege-convergence.test.ts \
              src/__tests__/db/editor-code-attempts.test.ts \
              src/__tests__/db/embed-ui-rows-cleanup.test.ts \
              src/__tests__/db/content-changes-view.test.ts

      - name: Test Founding Agency capacity against disposable Postgres
        env:
          RCF_TEST_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
        run: |
          node <<'NODE'
          const { Client } = require("pg");

          (async () => {
            const client = new Client({ connectionString: process.env.RCF_TEST_DB_URL });
            await client.connect();
            try {
              const { rows } = await client.query(`
                SELECT to_regclass('public.founding_agency_reservations')::text AS reservations,
                       to_regprocedure('public.reserve_founding_agency_spot(uuid)')::text AS reserve_rpc,
                       to_regprocedure('public.bind_founding_agency_checkout(uuid,uuid,text)')::text AS bind_rpc,
                       to_regprocedure('public.release_founding_agency_checkout(uuid,uuid,text)')::text AS release_rpc,
                       to_regprocedure('public.complete_founding_agency_purchase(uuid,uuid,text)')::text AS complete_rpc,
                       to_regprocedure('public.get_founding_agency_availability()')::text AS availability_rpc
              `);
              if (!rows[0] || Object.values(rows[0]).some((value) => value === null)) {
                throw new Error("Founding Agency migration schema is incomplete.");
              }
            } finally {
              await client.end();
            }
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          NODE
          npm test -- --runInBand src/__tests__/db/founding-agency-cap.test.ts

      - name: Test AI credit spend and refund against disposable Postgres
        env:
          RCF_TEST_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          RCF_REQUIRE_TEST_DB: "1"
        run: npx jest --runInBand src/__tests__/db/credit-spend.test.ts

      # s47a: the founding offer's 20-spot cap, eligibility and claim/grant
      # atomicity are database properties. DB suites run in CI only by name, and
      # RCF_REQUIRE_TEST_DB turns an unreachable database into a failure instead
      # of a "[gated]" pass. The suite itself fails closed on a missing migration.
      - name: Test founding offer capacity against disposable Postgres
        env:
          RCF_TEST_DB_URL: "postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          RCF_REQUIRE_TEST_DB: "1"
        run: npm test -- --runInBand src/__tests__/db/founding-offer-cap.test.ts

      - name: Build production app
        run: npm run build

      - name: Run all 86 Playwright tests (blocking)
        run: |
          set -euo pipefail
          ws_log="$RUNNER_TEMP/recopyfast-ws.log"
          app_log="$RUNNER_TEMP/recopyfast-next.log"

          NODE_ENV=production npm --prefix server start > "$ws_log" 2>&1 &
          ws_pid=$!
          NODE_ENV=production npm run start > "$app_log" 2>&1 &
          app_pid=$!

          cleanup() {
            kill "$app_pid" "$ws_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
            wait "$ws_pid" 2>/dev/null || true
          }
          trap cleanup EXIT INT TERM

          wait_for_url() {
            url="$1"
            label="$2"
            for attempt in $(seq 1 60); do
              if curl --fail --silent --show-error "$url" > /dev/null; then
                return 0
              fi
              sleep 2
            done
            echo "$label did not become ready at its local URL." >&2
            return 1
          }

          wait_for_url "http://127.0.0.1:4001/health" "WebSocket service"
          wait_for_url "http://127.0.0.1:3000/login" "Next.js app"
          npm run test:e2e

          node <<'NODE'
          const { readFileSync } = require("node:fs");
          const report = JSON.parse(
            readFileSync("test-results/playwright-summary.json", "utf8"),
          );
          if (
            report.contract !== "passed" ||
            report.expected !== 86 ||
            report.total !== 86 ||
            report.passed !== 86 ||
            report.failed !== 0 ||
            report.skipped !== 0 ||
            report.flaky !== 0
          ) {
            throw new Error("Playwright did not produce the required clean 86-test summary.");
          }
          NODE

      - name: Stop disposable Supabase
        if: ${{ always() }}
        run: |
          supabase stop --no-backup > /dev/null 2>&1
          rm -f "$RUNNER_TEMP/supabase-start.log" "$RUNNER_TEMP/supabase-status.env"

      - name: Upload redacted Playwright summary
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-summary
          path: test-results/playwright-summary.json
          if-no-files-found: error
          retention-days: 7

  # ─── Separate job: full TypeScript check incl. tests ───────────────────────
  # Production app code is already gated (blocking) in the ci job above. This job
  # additionally type-checks TEST files. The 65 pre-existing broken-mock errors
  # have been burned down to 0, so this is now BLOCKING as well.
  type-check:
    name: TypeScript Type-Check incl. tests
    runs-on: ubuntu-latest

    env:
      # Supabase placeholders – tsc only needs the declarations, not live values
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      CI: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type-check (tsc --noEmit)
        run: npm run type-check
