name: Comparison Lighthouse

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Comparison Lighthouse (applied mobile, 8 routes)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      LIGHTHOUSE_BASE_URL: "http://127.0.0.1:4175"
      NEXT_PUBLIC_APP_URL: "http://127.0.0.1:4175"
      # The comparison pages fail closed to unavailable catalogue copy. Pointing
      # Supabase at a closed loopback port exercises that public state quickly
      # without a hosted project, production credential, or provider request.
      NEXT_PUBLIC_SUPABASE_URL: "http://127.0.0.1:1"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJyY2YtbGhjLWZpeHR1cmUiLCJyZWYiOiJsb2NhbCIsInJvbGUiOiJhbm9uIiwiaWF0IjoxNjAwMDAwMDAwLCJleHAiOjIwMDAwMDAwMDB9.fixture-signature"
      SUPABASE_SERVICE_ROLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJyY2YtbGhjLWZpeHR1cmUiLCJyZWYiOiJsb2NhbCIsInJvbGUiOiJzZXJ2aWNlX3JvbGUiLCJpYXQiOjE2MDAwMDAwMCwiZXhwIjoyMDAwMDAwMDB9.fixture-signature"
      AGENCY_CHECKOUT_ENABLED: "false"
      # s107 (ADR 063): a fake GA4 id, so the measured build carries Google
      # Analytics as production does. No country header is sent, so every run
      # takes the consent-required path production serves the EEA: the init
      # script and the banner, and no request to Google.
      NEXT_PUBLIC_GA_MEASUREMENT_ID: "G-E2ETEST000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build production app
        run: npm run build

      - name: Run five applied-mobile Lighthouse passes on all comparison routes
        run: npm run lighthouse:ci

      - name: Upload credential-free Lighthouse reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: comparison-lighthouse-${{ github.run_id }}
          path: test-results/lighthouse
          if-no-files-found: error
          retention-days: 14
